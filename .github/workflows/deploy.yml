name: Deploy Hugo Site to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:       # 允许手动触发

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: "0.126.0"   # ← 与你本地版本保持一致！
    steps:
      # ① 必须先 Checkout，文件才存在
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0         # 获取完整历史（GitInfo/Lastmod 需要）
       # ========== 缓存配置 START ==========
      - name: Cache Hugo modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/hugo_cache/modules
            ${{ github.workspace }}/resources/_gen
          key: hugo-modules-${{ runner.os }}-${{ hashFiles('go.sum', 'config.toml') }}
          restore-keys: |
            hugo-modules-${{ runner.os }}-

      - name: Cache npm dependencies
        if: hashFiles('package-lock.json') != ''   # 仅当项目有 package-lock.json 时启用
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-
      # ========== 缓存配置 END ==========
          # ② 然后注入 Secrets（此时 config.toml 已在工作目录根路径）
      - name: Inject secrets into config
        run: |
          sed -i "s|PLACEHOLDER_GITALK_CLIENT_ID|${{ secrets.GITALK_CLIENT_ID }}|g" config.toml
          sed -i "s|PLACEHOLDER_GITALK_CLIENT_SECRET|${{ secrets.GITALK_CLIENT_SECRET }}|g" config.toml
          sed -i "s|PLACEHOLDER_VALINE_APP_ID|${{ secrets.VALINE_APP_ID }}|g" config.toml
          sed -i "s|PLACEHOLDER_VALINE_APP_KEY|${{ secrets.VALINE_APP_KEY }}|g" config.toml
      # ③ 再安装 Hugo
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true         # LoveIt 必须用 Extended 版
      # ④ 最后构建
      - name: Build
        run: hugo --gc --minify --baseURL "${{ vars.SITE_BASEURL || 'https://blog.dazhongma.top/' }}"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4